name: Security and cross-platform validation
on:
  pull_request:
  push:
    branches: [main, 'security/**']
  workflow_dispatch:
env:
  POLYU_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
permissions:
  contents: read
concurrency:
  group: validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.15'}
      - run: python -B security/privacy_scan.py
      - run: python -B security/privacy_scan.py --history
      - run: python -B security/tool_runner.py gitleaks git --redact=100 --config .gitleaks.toml --log-opts=--all .
      - run: python -B security/tool_runner.py actionlint -shellcheck= -pyflakes=
      - run: python -B -m unittest discover -s WindowsApp -p test_privacy_gate.py
  python-tests:
    name: Python Tests
    needs: security-scan
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.10'}
      - run: python -B MacApp/prepare_document_dependencies.py
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r security/signing-requirements.txt'
      - run: python -B 验证/run_offline.py
      - run: python -B 验证/verify_local_api.py
      - run: python -B 验证/verify_keychain.py
      - run: python -B 验证/verify_signed_feeds.py
  mac-build:
    name: macOS Build and Test
    needs: [security-scan, python-tests]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.10'}
      - run: test "$(uname -m)" = arm64
      - run: python -B MacApp/prepare_document_dependencies.py
      - run: python -B MacApp/download_runtime.py
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r security/signing-requirements.txt'
      - run: python -B MacApp/build.py
      - run: python -B 验证/verify_mac_bundle.py
      - run: python -B 验证/run_native_gui.py
      - run: python -B 验证/verify_mac_updates.py
      - run: python -B MacApp/build.py --verify-release
      - run: python -B security/validate_platform.py mac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macOS-arm64-validated
          path: |
            Mac发布/PolyUStudyConsole-*.dmg
            Mac发布/PolyUStudyConsole-*.zip
            .security-local/mac-validation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  windows-build:
    name: Windows Build and Test
    needs: security-scan
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run: {shell: pwsh}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.10', architecture: x64}
      - name: Build locked Windows payload
        id: assemble
        run: python -B WindowsApp/assemble_windows.py --download
      - name: Offline Python regression
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $bundle = Get-ChildItem .build/windows-assembly -Directory -Filter PolyUStudyConsole-*-windows-x64 | Select-Object -First 1
          & "$($bundle.FullName)/runtime/python.exe" -I -B -X utf8 验证/run_offline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Loopback API authorization
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $bundle = Get-ChildItem .build/windows-assembly -Directory -Filter PolyUStudyConsole-*-windows-x64 | Select-Object -First 1
          & "$($bundle.FullName)/runtime/python.exe" -I -B -X utf8 验证/verify_local_api.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native DPAPI PDF OCR and backend
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $bundle = Get-ChildItem .build/windows-assembly -Directory -Filter PolyUStudyConsole-*-windows-x64 | Select-Object -First 1
          & "$($bundle.FullName)/runtime/python.exe" -I -B -X utf8 "$($bundle.FullName)/WindowsApp/main.py" --platform-check > 验证/windows-native-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native WebView2 lifecycle
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $portable = Get-ChildItem Win发布 -Filter PolyUStudyConsole-*-windows-x64.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $portable.FullName -DestinationPath .build/windows-portable-check
          $bundle = Get-ChildItem .build/windows-portable-check -Directory -Filter PolyUStudyConsole-*-windows-x64 | Select-Object -First 1
          $env:POLYU_GUI_EVIDENCE = "$pwd/验证/windows-gui-evidence.json"
          & "$($bundle.FullName)/runtime/python.exe" -I -B -X utf8 "$($bundle.FullName)/WindowsApp/main.py" --gui-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native update install restart rollback
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        timeout-minutes: 7
        run: |
          $bundle = Get-ChildItem .build/windows-assembly -Directory -Filter PolyUStudyConsole-*-windows-x64 | Select-Object -First 1
          & "$($bundle.FullName)/runtime/python.exe" -I -B -X utf8 验证/verify_windows_updates.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native install and uninstall
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        timeout-minutes: 5
        run: python -B WindowsApp/installer_verify.py
      - run: python -B security/validate_platform.py windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Windows-x64-validated
          path: |
            Win发布/PolyUStudyConsole-*.exe
            Win发布/PolyUStudyConsole-*.zip
            .security-local/windows-validation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  release-validation:
    name: Release Validation
    needs: [security-scan, python-tests, mac-build, windows-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {path: .security-local/release-input}
      - run: python -B security/release.py --validate .security-local/release-input --output .security-local/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-validated
          path: .security-local/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
