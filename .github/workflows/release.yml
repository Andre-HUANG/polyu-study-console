name: Publish validated release
on:
  workflow_dispatch:
    inputs:
      validation_run:
        description: Successful main-branch validation run ID
        required: true
        type: string
      publish:
        description: Publish after all validation gates (false creates a Draft)
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12.15'}
      - name: Validate trusted source run
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
        run: python -B security/release.py --check-run "$VALIDATION_RUN"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-validated
          path: .security-local/release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validation_run }}
      - name: Sign locked update sources
        env:
          POLYU_UPDATER_ED25519_KEY: ${{ secrets.POLYU_UPDATER_ED25519_KEY }}
        run: |
          test -n "$POLYU_UPDATER_ED25519_KEY"
          python -m pip install --only-binary=:all: --require-hashes -r security/signing-requirements.txt
          python -B release_updates.py .security-local/release --sign
      - name: Publish checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
          POLYU_RELEASE_ACCEPTANCE: ${{ secrets.POLYU_RELEASE_ACCEPTANCE }}
          POLYU_RELEASE_PERFORMANCE: ${{ secrets.POLYU_RELEASE_PERFORMANCE }}
          VALIDATION_RUN: ${{ inputs.validation_run }}
        run: python -B security/release.py --publish .security-local/release
